[project]
name = "supplyscope-backend"
version = "0.1.0"
description = "SupplyScope backend — agentic analytics for EPC supply chain (PFE, GETS/IHEC Carthage)"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pydantic[email]>=2.9",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
