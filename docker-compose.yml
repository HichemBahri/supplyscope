name: supplyscope

services:
  postgres:
    image: postgres:16-alpine
    container_name: supplyscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-supplyscope}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL files here run automatically on FIRST container start (empty volume only)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-supplyscope}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: supplyscope-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres          # inside the compose network
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-supplyscope}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AGENT_DB_USER: ${AGENT_DB_USER:-agent_reader}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-agent_reader_dev_only}
      JWT_SECRET: ${JWT_SECRET:?set it in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-claude-haiku-4-5}
      LLM_MODEL_SMART: ${LLM_MODEL_SMART:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:4
    container_name: supplyscope-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
